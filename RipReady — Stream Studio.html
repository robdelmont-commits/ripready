<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RipReady — Stream Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./RipReady — Stream Studio_files/css2" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #242424;
    --teal: #00FFD1;
    --teal-dim: rgba(0,255,209,0.12);
    --teal-glow: rgba(0,255,209,0.25);
    --red: #FF3B5C;
    --red-dim: rgba(255,59,92,0.15);
    --muted: #555;
    --text: #e8e8e8;
    --text-dim: #888;
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--teal);
    text-transform: uppercase;
  }
  .logo span { color: #fff; }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    transition: all 0.3s;
  }
  .status-pill.idle {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .status-pill.connecting {
    background: rgba(255,180,0,0.12);
    color: #FFB400;
    border: 1px solid rgba(255,180,0,0.3);
  }
  .status-pill.live {
    background: rgba(255,59,92,0.15);
    color: var(--red);
    border: 1px solid rgba(255,59,92,0.4);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-pill.live .status-dot {
    animation: pulse-red 1.2s ease-in-out infinite;
  }
  @keyframes pulse-red {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  /* ── MAIN LAYOUT ── */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    overflow: hidden;
  }

  /* ── VIDEO PANE ── */
  .video-pane {
    display: flex;
    flex-direction: column;
    background: #000;
    position: relative;
    border-right: 1px solid var(--border);
  }

  .video-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    min-height: 300px;
  }

  #preview {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transform: scaleX(-1); /* mirror for natural feel */
  }

  .video-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
  }
  .video-empty svg {
    opacity: 0.3;
  }
  .video-empty p {
    font-size: 13px;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* live overlay badge */
  .live-badge {
    display: none;
    position: absolute;
    top: 14px;
    left: 14px;
    background: var(--red);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 4px 10px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .live-badge.visible { display: block; }

  /* stats bar */
  .stats-bar {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .stat {
    flex: 1;
    padding: 10px 14px;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-label {
    font-size: 9px;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .stat-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
  }
  .stat-value.live { color: var(--teal); }

  /* ── CONTROL PANEL ── */
  .control-panel {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    background: var(--surface);
  }

  .panel-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .section-label {
    font-size: 9px;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* Device selectors */
  .device-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .device-select-wrap {
    position: relative;
  }
  .device-select-wrap label {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    padding: 8px 10px;
    appearance: none;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus { border-color: var(--teal); }

  /* WHIP credentials */
  .field-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .field-wrap label {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  input[type="text"], input[type="url"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 11px;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--teal); }
  input::placeholder { color: var(--muted); }

  .input-action {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .input-action input { flex: 1; font-size: 10px; }
  .paste-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.5px;
    padding: 8px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .paste-btn:hover { border-color: var(--teal); color: var(--teal); }

  /* token display */
  textarea#tokenInput {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--teal);
    font-family: monospace;
    font-size: 10px;
    padding: 8px 10px;
    outline: none;
    resize: none;
    height: 54px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  textarea#tokenInput:focus { border-color: var(--teal); }
  textarea#tokenInput::placeholder { color: var(--muted); font-family: 'Barlow', sans-serif; font-size: 11px; }

  /* credential status */
  .cred-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    margin-top: 6px;
  }
  .cred-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .cred-status.ready .cred-dot { background: var(--teal); }
  .cred-status.ready span { color: var(--teal); }
  .cred-status span { color: var(--muted); }

  /* ── STREAM CONTROLS ── */
  .stream-controls {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-go-live {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius);
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-go-live.ready {
    background: var(--teal);
    color: #000;
    box-shadow: 0 0 24px rgba(0,255,209,0.3);
  }
  .btn-go-live.ready:hover {
    background: #00ffe0;
    box-shadow: 0 0 36px rgba(0,255,209,0.5);
    transform: translateY(-1px);
  }
  .btn-go-live.connecting {
    background: rgba(255,180,0,0.2);
    color: #FFB400;
    border: 1px solid rgba(255,180,0,0.4);
    cursor: not-allowed;
  }
  .btn-go-live.end {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(255,59,92,0.4);
  }
  .btn-go-live.end:hover {
    background: rgba(255,59,92,0.25);
  }
  .btn-go-live:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-camera {
    width: 100%;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-camera:hover {
    border-color: var(--teal);
    color: var(--teal);
  }
  .btn-camera.active {
    border-color: var(--teal);
    color: var(--teal);
    background: var(--teal-dim);
  }

  /* ── LOG ── */
  .log-pane {
    padding: 12px 16px;
    flex: 1;
    overflow-y: auto;
    min-height: 120px;
    max-height: 200px;
  }
  .log-entry {
    font-size: 10px;
    font-family: monospace;
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    line-height: 1.6;
  }
  .log-entry.info { color: var(--text-dim); }
  .log-entry.success { color: var(--teal); }
  .log-entry.error { color: var(--red); }
  .log-entry.warn { color: #FFB400; }
  .log-time { opacity: 0.4; margin-right: 6px; }

  /* ── MOBILE ── */
  @media (max-width: 700px) {
    .main {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }
    .video-pane { border-right: none; border-bottom: 1px solid var(--border); }
    .video-wrap { min-height: 220px; }
    .control-panel { overflow-y: visible; }
    .log-pane { max-height: 140px; }
    .stats-bar { display: none; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">Rip<span>Ready</span></div>
  <div class="status-pill idle" id="statusPill">
    <div class="status-dot"></div>
    <span id="statusText">Offline</span>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- VIDEO PANE -->
  <div class="video-pane">
    <div class="video-wrap">
      <video id="preview" autoplay="" muted="" playsinline=""></video>
      <div class="video-empty" id="videoEmpty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"></path>
        </svg>
        <p>Camera off</p>
      </div>
      <div class="live-badge" id="liveBadge">● Live</div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-label">Duration</div>
        <div class="stat-value" id="statDuration">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Connection</div>
        <div class="stat-value" id="statConn">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">ICE State</div>
        <div class="stat-value" id="statICE">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Video</div>
        <div class="stat-value" id="statVideo">—</div>
      </div>
    </div>
  </div>

  <!-- CONTROL PANEL -->
  <div class="control-panel">

    <!-- DEVICES -->
    <div class="panel-section">
      <div class="section-label">Devices</div>
      <div class="device-row">
        <div class="device-select-wrap">
          <label>Camera</label>
          <select id="camSelect"><option value="">Camera 1</option></select>
        </div>
        <div class="device-select-wrap">
          <label>Microphone</label>
          <select id="micSelect"><option value="">Microphone 1</option></select>
        </div>
        <button class="btn-camera" id="btnCamera" onclick="toggleCamera()">Start Camera Preview</button>
      </div>
    </div>

    <!-- WHIP CREDENTIALS -->
    <div class="panel-section">
      <div class="section-label">Whatnot Credentials</div>
      <div class="field-row">
        <div class="field-wrap">
          <label>WHIP Server</label>
          <input type="url" id="whipServer" value="https://global.whip.live-video.net" placeholder="https://global.whip.live-video.net">
        </div>
        <div class="field-wrap">
          <label>Bearer Token — paste from Whatnot Show Tools</label>
          <textarea id="tokenInput" placeholder="Paste bearer token here (Ctrl+V / Cmd+V)" oninput="handleTokenInput(this.value)" spellcheck="false" autocomplete="off"></textarea>
        </div>
        <div class="cred-status" id="credStatus">
          <div class="cred-dot"></div>
          <span>No token entered</span>
        </div>
      </div>
    </div>

    <!-- STREAM CONTROLS -->
    <div class="stream-controls">
      <button class="btn-go-live ready" id="btnGoLive" onclick="handleStreamButton()" disabled="">
        Go Live
      </button>
      <button class="btn-camera" id="btnMute" onclick="toggleMute()" style="display:none">
        Mute Mic
      </button>
    </div>

    <!-- LOG -->
    <div class="panel-section" style="padding-bottom:0; flex:1; display:flex; flex-direction:column; min-height:0;">
      <div class="section-label">Console</div>
      <div class="log-pane" id="logPane"><div class="log-entry info"><span class="log-time">15:43:37</span>RipReady Stream Studio initializing…</div><div class="log-entry info"><span class="log-time">15:43:37</span>WebRTC supported ✓</div><div class="log-entry success"><span class="log-time">15:43:39</span>Found 1 camera(s), 1 mic(s)</div><div class="log-entry info"><span class="log-time">15:43:39</span>Ready — start camera preview to begin</div></div>
    </div>

  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let localStream = null;
let pc = null;            // RTCPeerConnection
let isLive = false;
let isCameraOn = false;
let isMuted = false;
let streamStartTime = null;
let durationTimer = null;
let bearerToken = '';
let statsInterval = null;

const videoEl = document.getElementById('preview');
const videoEmpty = document.getElementById('videoEmpty');
const liveBadge = document.getElementById('liveBadge');
const statusPill = document.getElementById('statusPill');
const statusText = document.getElementById('statusText');
const btnGoLive = document.getElementById('btnGoLive');
const btnCamera = document.getElementById('btnCamera');
const btnMute = document.getElementById('btnMute');
const credStatus = document.getElementById('credStatus');
const logPane = document.getElementById('logPane');

// ── LOGGING ────────────────────────────────────────────────────────────────
function log(msg, type = 'info') {
  const now = new Date();
  const t = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const el = document.createElement('div');
  el.className = `log-entry ${type}`;
  el.innerHTML = `<span class="log-time">${t}</span>${msg}`;
  logPane.appendChild(el);
  logPane.scrollTop = logPane.scrollHeight;
}

// ── DEVICE ENUMERATION ─────────────────────────────────────────────────────
async function enumerateDevices() {
  try {
    // Need permission first to get labels
    await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(s => s.getTracks().forEach(t => t.stop()));
  } catch(e) {}

  const devices = await navigator.mediaDevices.enumerateDevices();
  const camSelect = document.getElementById('camSelect');
  const micSelect = document.getElementById('micSelect');
  camSelect.innerHTML = '';
  micSelect.innerHTML = '';

  const cams = devices.filter(d => d.kind === 'videoinput');
  const mics = devices.filter(d => d.kind === 'audioinput');

  if (cams.length === 0) {
    camSelect.innerHTML = '<option>No camera found</option>';
  } else {
    cams.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Camera ${i + 1}`;
      camSelect.appendChild(opt);
    });
  }

  if (mics.length === 0) {
    micSelect.innerHTML = '<option>No mic found</option>';
  } else {
    mics.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Microphone ${i + 1}`;
      micSelect.appendChild(opt);
    });
  }

  log(`Found ${cams.length} camera(s), ${mics.length} mic(s)`, 'success');
}

// ── CAMERA PREVIEW ─────────────────────────────────────────────────────────
async function toggleCamera() {
  if (isCameraOn) {
    stopCamera();
    return;
  }

  try {
    log('Requesting camera access…');
    const camId = document.getElementById('camSelect').value;
    const micId = document.getElementById('micSelect').value;

    localStream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: camId ? { exact: camId } : undefined, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: { deviceId: micId ? { exact: micId } : undefined, echoCancellation: true, noiseSuppression: true }
    });

    videoEl.srcObject = localStream;
    videoEmpty.style.display = 'none';
    isCameraOn = true;
    btnCamera.textContent = 'Stop Camera';
    btnCamera.classList.add('active');

    const vTrack = localStream.getVideoTracks()[0];
    const settings = vTrack.getSettings();
    log(`Camera: ${vTrack.label} @ ${settings.width}×${settings.height}`, 'success');
    log(`Mic: ${localStream.getAudioTracks()[0]?.label || 'none'}`, 'success');

    checkReadyToStream();
  } catch(e) {
    log(`Camera error: ${e.message}`, 'error');
  }
}

function stopCamera() {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  videoEl.srcObject = null;
  videoEmpty.style.display = 'flex';
  isCameraOn = false;
  btnCamera.textContent = 'Start Camera Preview';
  btnCamera.classList.remove('active');
  checkReadyToStream();
}

// ── TOKEN PASTE ────────────────────────────────────────────────────────────
function handleTokenInput(value) {
  bearerToken = value.trim();
  const credStatus = document.getElementById('credStatus');
  if (bearerToken.length > 20) {
    credStatus.className = 'cred-status ready';
    credStatus.innerHTML = '<div class="cred-dot"></div><span>Token ready ✓ (' + bearerToken.length + ' chars)</span>';
    log('Bearer token entered (' + bearerToken.length + ' chars)', 'success');
  } else {
    credStatus.className = 'cred-status';
    credStatus.innerHTML = '<div class="cred-dot"></div><span>No token entered</span>';
    bearerToken = '';
  }
  checkReadyToStream();
}

// ── READY CHECK ────────────────────────────────────────────────────────────
function checkReadyToStream() {
  const ready = isCameraOn && bearerToken.length > 0;
  btnGoLive.disabled = !ready;
  if (ready) {
    log('Ready to stream — hit Go Live', 'success');
  }
}

// ── WHIP STREAMING ─────────────────────────────────────────────────────────
async function handleStreamButton() {
  if (isLive) {
    await endStream();
  } else {
    await startStream();
  }
}

async function startStream() {
  if (!localStream) { log('No camera stream', 'error'); return; }

  // Always read token fresh from the textarea at the moment of streaming
  const tokenEl = document.getElementById('tokenInput');
  if (tokenEl && tokenEl.value.trim().length > 20) {
    bearerToken = tokenEl.value.trim();
  }
  log(`Token at stream time: ${bearerToken.length} chars`, bearerToken.length > 20 ? 'success' : 'error');
  if (!bearerToken || bearerToken.length < 20) {
    log('No token — paste your Whatnot bearer token first', 'error');
    return;
  }

  const server = document.getElementById('whipServer').value.trim();
  if (!server) { log('No WHIP server URL', 'error'); return; }

  log('Initializing WebRTC…');
  setStatus('connecting');

  try {
    pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    // Add tracks
    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
      log(`Added ${track.kind} track: ${track.label}`);
    });

    // ICE state monitoring
    pc.oniceconnectionstatechange = () => {
      const state = pc.iceConnectionState;
      document.getElementById('statICE').textContent = state;
      log(`ICE: ${state}`, state === 'connected' || state === 'completed' ? 'success' : 'info');
      if (state === 'failed') {
        log('ICE failed — check network/firewall', 'error');
        endStream();
      }
    };

    pc.onconnectionstatechange = () => {
      const state = pc.connectionState;
      document.getElementById('statConn').textContent = state;
      if (state === 'connected') {
        log('WebRTC connected ✓', 'success');
        setLive(true);
        startStatsPolling();
      }
      if (state === 'failed' || state === 'disconnected') {
        log(`Connection ${state}`, 'error');
        endStream();
      }
    };

    // Create offer
    log('Creating SDP offer…');
    const offer = await pc.createOffer({
      offerToReceiveVideo: false,
      offerToReceiveAudio: false
    });
    await pc.setLocalDescription(offer);

    // Wait for ICE gathering
    await waitForICE(pc);
    log('ICE gathering complete');

    // WHIP HTTP POST
    log(`POSTing to: ${server}`);
    const response = await fetch(server, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/sdp',
        'Authorization': `Bearer ${bearerToken}`
      },
      body: pc.localDescription.sdp
    });

    log(`WHIP response: ${response.status} ${response.statusText}`,
      response.ok ? 'success' : 'error');

    if (!response.ok) {
      const body = await response.text();
      log(`Error body: ${body.substring(0, 200)}`, 'error');
      throw new Error(`WHIP ${response.status}: ${response.statusText}`);
    }

    const answerSDP = await response.text();
    log('Received SDP answer from Whatnot ✓', 'success');

    await pc.setRemoteDescription({ type: 'answer', sdp: answerSDP });
    log('Remote description set — stream negotiated', 'success');

  } catch(e) {
    log(`Stream error: ${e.message}`, 'error');
    setStatus('idle');
    if (pc) { pc.close(); pc = null; }
  }
}

function waitForICE(pc) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    const check = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', check);
    // Timeout after 5s
    setTimeout(resolve, 5000);
  });
}

async function endStream() {
  log('Ending stream…');
  if (pc) {
    pc.close();
    pc = null;
  }
  setLive(false);
  setStatus('idle');
  stopStatsPolling();
  log('Stream ended', 'warn');
}

// ── LIVE STATE ─────────────────────────────────────────────────────────────
function setLive(live) {
  isLive = live;
  liveBadge.className = live ? 'live-badge visible' : 'live-badge';
  btnMute.style.display = live ? 'block' : 'none';

  if (live) {
    streamStartTime = Date.now();
    durationTimer = setInterval(updateDuration, 1000);
    btnGoLive.textContent = 'End Stream';
    btnGoLive.className = 'btn-go-live end';
    setStatus('live');
  } else {
    clearInterval(durationTimer);
    streamStartTime = null;
    document.getElementById('statDuration').textContent = '—';
    document.getElementById('statConn').textContent = '—';
    document.getElementById('statICE').textContent = '—';
    document.getElementById('statVideo').textContent = '—';
    btnGoLive.textContent = 'Go Live';
    btnGoLive.className = 'btn-go-live ready';
  }
}

function setStatus(state) {
  statusPill.className = `status-pill ${state}`;
  const labels = { idle: 'Offline', connecting: 'Connecting…', live: 'Live' };
  statusText.textContent = labels[state] || state;
}

function updateDuration() {
  if (!streamStartTime) return;
  const elapsed = Math.floor((Date.now() - streamStartTime) / 1000);
  const h = Math.floor(elapsed / 3600);
  const m = Math.floor((elapsed % 3600) / 60);
  const s = elapsed % 60;
  const fmt = h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('statDuration').textContent = fmt;
  document.getElementById('statDuration').className = 'stat-value live';
}

// ── STATS POLLING ─────────────────────────────────────────────────────────
function startStatsPolling() {
  statsInterval = setInterval(async () => {
    if (!pc) return;
    try {
      const stats = await pc.getStats();
      stats.forEach(report => {
        if (report.type === 'outbound-rtp' && report.kind === 'video') {
          const kb = Math.round((report.bytesSent || 0) / 1024);
          document.getElementById('statVideo').textContent = kb > 0 ? `${kb} KB` : '—';
        }
      });
    } catch(e) {}
  }, 2000);
}

function stopStatsPolling() {
  clearInterval(statsInterval);
  statsInterval = null;
}

// ── MIC TOGGLE ─────────────────────────────────────────────────────────────
function toggleMute() {
  if (!localStream) return;
  const audioTracks = localStream.getAudioTracks();
  isMuted = !isMuted;
  audioTracks.forEach(t => t.enabled = !isMuted);
  btnMute.textContent = isMuted ? 'Unmute Mic' : 'Mute Mic';
  btnMute.className = isMuted ? 'btn-camera active' : 'btn-camera';
  log(`Mic ${isMuted ? 'muted' : 'unmuted'}`, 'info');
}

// ── INIT ───────────────────────────────────────────────────────────────────
(async () => {
  log('RipReady Stream Studio initializing…');
  if (!navigator.mediaDevices || !window.RTCPeerConnection) {
    log('WebRTC not supported in this browser — use Chrome or Edge', 'error');
    return;
  }
  log('WebRTC supported ✓');
  await enumerateDevices();
  log('Ready — start camera preview to begin', 'info');
})();
</script>
