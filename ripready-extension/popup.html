<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RipReady</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      background: #080808;
      color: #ffffff;
      font-family: 'Barlow', sans-serif;
      padding: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1a1a1a;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: #00FFD1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #080808;
    }

    .logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .logo-sub {
      font-size: 11px;
      color: #555;
      margin-top: 1px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }

    .status-dot.active {
      background: #00FFD1;
      box-shadow: 0 0 6px #00FFD1;
    }

    .status-dot.waiting {
      background: #FFB800;
      box-shadow: 0 0 6px #FFB800;
    }

    .status-text {
      font-size: 13px;
      color: #aaa;
    }

    .status-text strong {
      color: #fff;
    }

    .instructions {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .instructions-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #00FFD1;
      margin-bottom: 10px;
    }

    .step {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #999;
      line-height: 1.5;
    }

    .step:last-child { margin-bottom: 0; }

    .step-num {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      background: #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: #00FFD1;
      margin-top: 1px;
    }

    .open-btn {
      width: 100%;
      background: #00FFD1;
      color: #080808;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .open-btn:hover {
      background: #00e8bd;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-mark">R</div>
    <div>
      <div class="logo-text">RipReady</div>
      <div class="logo-sub">Whatnot Stream Bridge</div>
    </div>
  </div>

  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Waiting for Whatnot connection</div>
  </div>

  <div class="instructions">
    <div class="instructions-title">How to go live</div>
    <div class="step">
      <div class="step-num">1</div>
      <div>Open RipReady in a browser tab</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div>Go to Whatnot → Seller Hub → OBS Tools</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div>Enter your password and click Connect</div>
    </div>
    <div class="step">
      <div class="step-num">4</div>
      <div>Click Start Show — RipReady goes live automatically</div>
    </div>
  </div>

  <button class="open-btn" id="openBtn">Open RipReady</button>

  <script src="popup.js"></script>
</body>
</html>
